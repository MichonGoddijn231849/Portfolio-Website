                { id: 1, title: "Emotion Detection MLOps Pipeline", year: "Year 2, Block D", accentColor: "blue", tags: ["Azure ML", "Docker", "FastAPI", "CI/CD", "React", "Airflow"], description: "Production-grade emotion detection system for video/audio analysis, deployed on Azure with full MLOps lifecycle automation.", fullDescription: "Built an end-to-end MLOps pipeline for automated emotion detection in TV show content for Content Intelligence Agency. Developed a production-ready Python package with CLI, REST API, and React/TypeScript web interface. Implemented comprehensive Azure ML pipelines for data versioning, automated training, and multi-strategy deployment (local, on-premise, cloud). Created CI/CD workflows with GitHub Actions, containerized all components with Docker, and established monitoring dashboards with automated retraining triggers. Managed project using Scrum methodology across 5 two-week sprints with Azure DevOps.", technologies: ["Azure ML", "FastAPI", "Docker", "React/TypeScript", "MLflow", "Airflow", "GitHub Actions"], achievements: ["Deployed scalable API supporting 6 emotions across 3 languages (EN/FR/NL)", "Implemented automated pipelines: data ingestion, training, deployment, monitoring", "Built production package with CLI, REST API, and modern web interface", "Achieved Level 2-3 MLOps maturity with CI/CD, versioning, and auto-retraining"], github: "https://github.com/MichonGoddijn231849/Portfolio/tree/main/Year%202%20Block%20D" },
